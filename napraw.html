<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Groom — naprawa</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#070b0f; color:#eee; font-family:Arial,sans-serif; }
    main { width:min(520px,calc(100% - 32px)); padding:28px; border:1px solid #6d5b35; background:#101417; }
    button { width:100%; min-height:52px; border:1px solid #d4b772; background:#d4b772; color:#080b0d; font-weight:700; }
    p { color:#aaa; line-height:1.55; }
  </style>
</head>
<body>
  <main>
    <h1>Naprawa aplikacji</h1>
    <p>Ten ekran usuwa stary Service Worker i wszystkie zapisane pliki aplikacji.</p>
    <button id="repair">NAPRAW I OTWÓRZ GRĘ</button>
  </main>
  <script>
    document.getElementById("repair").onclick = async function () {
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } finally {
        location.replace("./?v=047");
      }
    };
  </script>
</body>
</html>
